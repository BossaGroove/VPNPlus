name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: Build & test (macOS, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The app scaffold (project.yml + Packages/) lands with the first
      # milestone. Until it does, this workflow reports success rather than
      # painting every commit red.
      - name: Is there an app to build yet?
        id: scaffold
        run: |
          if [ -f project.yml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No project.yml yet — skipping build and tests."
          fi

      - name: Select Xcode
        if: steps.scaffold.outputs.ready == 'true'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test local packages
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          set -o pipefail
          shopt -s nullglob
          for manifest in Packages/*/Package.swift; do
            package="$(dirname "$manifest")"
            echo "── $package"
            swift test --package-path "$package"
          done

      - name: Generate Xcode project
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          xcodebuild -project VPNPlus.xcodeproj -scheme VPNPlus \
            -configuration Release CODE_SIGN_IDENTITY=- build | tail -20
