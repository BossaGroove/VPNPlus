name: CI

on:
  push:
    branches: [master]
  pull_request:
  # "Run workflow" on the Actions tab: CI on demand, with nothing to push.
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test (macOS, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test local packages
        run: |
          set -o pipefail
          shopt -s nullglob
          for manifest in Packages/*/Package.swift; do
            package="$(dirname "$manifest")"
            echo "── $package"
            swift test --package-path "$package"
          done

      # openvpn3's C dependencies, as static universal libraries. The script
      # skips anything already built, so a cache hit makes this a no-op.
      - name: Cache third-party libraries
        uses: actions/cache@v4
        with:
          path: ThirdParty/out
          key: thirdparty-${{ runner.os }}-${{ hashFiles('Scripts/build-deps.sh') }}
      - name: Build third-party libraries
        run: Scripts/build-deps.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # The generated project is committed, so a stale one is a real defect:
      # it means someone edited project.yml without regenerating.
      - name: Check the committed project is up to date
        run: |
          if ! git diff --quiet -- VPNPlus.xcodeproj; then
            echo "::error::VPNPlus.xcodeproj is stale. Run 'xcodegen generate' and commit the result."
            git diff --stat -- VPNPlus.xcodeproj
            exit 1
          fi

      # Signing needs the Developer ID certificate and both provisioning
      # profiles, which only the release workflow has. CI proves it compiles.
      - name: Build (Debug and Release, unsigned)
        run: |
          set -o pipefail
          for config in Debug Release; do
            echo "── $config"
            xcodebuild -project VPNPlus.xcodeproj -scheme VPNPlus \
              -configuration "$config" -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO build | tail -5
          done

      # The engine's tests (profile validation, D189) live in an Xcode test
      # bundle because they need the C++ library, which a Swift package cannot
      # build.
      - name: Test the engine
        run: |
          set -o pipefail
          xcodebuild -project VPNPlus.xcodeproj -scheme VPNPlus \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO test | grep -E "Test run|✔|✘|TEST" 

      # A provider override that goes missing does not fail the build: NE calls
      # what exists, and a Disconnect that never reaches the engine looks fine
      # on screen. It happened once. The binary must expose all four.
      - name: Check the provider's lifecycle overrides are present
        run: |
          set -o pipefail
          APP=$(xcodebuild -project VPNPlus.xcodeproj -scheme VPNPlus -configuration Release \
            -showBuildSettings 2>/dev/null | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')/VPN\ Plus.app
          BIN=$(ls "$APP"/Contents/Library/SystemExtensions/*.systemextension/Contents/MacOS/* | head -1)
          # Read once, then searched: `strings | grep -q` under pipefail fails
          # exactly when it matches — grep quits early and strings dies on the
          # closed pipe (CI #1, 2026-09-25).
          SYMBOLS=$(strings "$BIN")
          for sel in "startTunnelWithOptions:completionHandler:" "stopTunnelWithReason:completionHandler:" "sleepWithCompletionHandler:" "wake"; do
            grep -qx "$sel" <<< "$SYMBOLS" || { echo "::error::the tunnel provider does not implement $sel"; exit 1; }
          done
          echo "all four lifecycle overrides present"

      # sysextd matches an activation request against the bundle's DIRECTORY
      # NAME in Contents/Library/SystemExtensions and never opens the bundle.
      # A wrongly named extension fails with "extension not found" at runtime
      # and nothing in the build catches it. This does.
      - name: Check the extension bundle is named after its identifier
        run: |
          set -o pipefail
          APP=$(xcodebuild -project VPNPlus.xcodeproj -scheme VPNPlus -configuration Release \
            -showBuildSettings 2>/dev/null | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')/VPN\ Plus.app
          EXT=$(ls -d "$APP"/Contents/Library/SystemExtensions/*.systemextension | head -1)
          ID=$(plutil -extract CFBundleIdentifier raw "$EXT/Contents/Info.plist")
          NAME=$(basename "$EXT" .systemextension)
          if [ "$ID" != "$NAME" ]; then
            echo "::error::extension bundle is named '$NAME' but its identifier is '$ID' — sysextd will never find it"
            exit 1
          fi
          echo "extension bundle name matches identifier: $ID"
