name: Release

# Pushing a tag like v0.1.0 builds a universal DMG and publishes a GitHub
# release. Signing, notarization, and the Sparkle appcast each activate only
# when their secrets exist (MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD,
# APPLE_TEAM_ID, APPLE_ID, APPLE_APP_PASSWORD, SPARKLE_ED_PRIVATE_KEY) —
# without secrets the workflow still produces an ad-hoc-signed DMG marked as
# a pre-release.
#
# The app embeds a NetworkExtension system extension at
# Contents/Library/SystemExtensions. That means two provisioning profiles are
# build inputs (PROVISIONING_PROFILE_APP, PROVISIONING_PROFILE_EXT), signing
# runs inside-out with entitlements passed explicitly per component, and
# xcodebuild's own signing is bypassed — Xcode demands an exact match between
# the entitlements file and the profile, and ours allow-list eight
# NetworkExtension values where we claim one.
#
# NOT YET REHEARSED. Every step below is derived from documentation and from
# artefacts inspected by hand; no tag has ever run it. The first release is the
# test.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Fails before the (long) build if the tagged version has no changelog
      # entry — the release notes feed both Sparkle and the GitHub release.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Strip blank lines from both ends, keeping the ones that separate
          # blocks — markdown needs them around headings and lists.
          trim() {
            awk 'NF || seen { print; seen = 1 }' | tail -r \
              | awk 'NF || seen { print; seen = 1 }' | tail -r
          }
          awk -v version="$VERSION" '
            /^## / {
              if (found) exit
              split(substr($0, 4), heading, " ")
              if (heading[1] == version) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md | trim > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## $VERSION' section — add one before tagging." >&2
            exit 1
          fi
          cat release-notes.md

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # openvpn3's C dependencies, as static universal libraries. The script
      # skips anything already built, so a cache hit makes this a no-op.
      - name: Cache third-party libraries
        uses: actions/cache@v4
        with:
          path: ThirdParty/out
          key: thirdparty-${{ runner.os }}-${{ hashFiles('Scripts/build-deps.sh') }}
      - name: Build third-party libraries
        run: Scripts/build-deps.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=release.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build (universal, unsigned)
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Always unsigned here. Signing is done by hand below, because
          # Xcode's exact-match validation rejects our legitimate profiles.
          xcodebuild -project VPNPlus.xcodeproj -scheme VPNPlus \
            -configuration Release -derivedDataPath build \
            -destination 'platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Embed provisioning profiles
        if: env.HAS_SIGNING == 'true'
        env:
          PROFILE_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PROFILE_EXT: ${{ secrets.PROVISIONING_PROFILE_EXT }}
        run: |
          APP="build/Build/Products/Release/VPN Plus.app"
          EXT=$(ls -d "$APP"/Contents/Library/SystemExtensions/*.systemextension | head -1)
          # A restricted entitlement is only honoured when a profile embedded
          # in that bundle allow-lists it. One profile per signing subject.
          echo "$PROFILE_APP" | base64 --decode > "$APP/Contents/embedded.provisionprofile"
          echo "$PROFILE_EXT" | base64 --decode > "$EXT/Contents/embedded.provisionprofile"
          for p in "$APP/Contents/embedded.provisionprofile" \
                   "$EXT/Contents/embedded.provisionprofile"; do
            security cms -D -i "$p" > /dev/null || { echo "::error::$p is not a valid profile"; exit 1; }
          done

      - name: Sign (inside out)
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/VPN Plus.app"
          EXT=$(ls -d "$APP"/Contents/Library/SystemExtensions/*.systemextension | head -1)
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          SIGN=(codesign --force --sign "Developer ID Application" \
                --options runtime --timestamp)

          # Order is load-bearing: an outer signature covers the inner ones, so
          # re-signing anything inner afterwards invalidates the outer.

          # 1. The system extension, with its own entitlements.
          "${SIGN[@]}" --entitlements VPNPlusTunnel/VPNPlusTunnel.release.entitlements "$EXT"

          # 2. Sparkle's nested executables, which keep Sparkle's own
          #    signatures otherwise and are rejected by notarization.
          if [ -d "$SPARKLE" ]; then
            for nested in \
              "$SPARKLE/Versions/B/XPCServices/Installer.xpc" \
              "$SPARKLE/Versions/B/XPCServices/Downloader.xpc" \
              "$SPARKLE/Versions/B/Autoupdate" \
              "$SPARKLE/Versions/B/Updater.app"; do
              [ -e "$nested" ] && "${SIGN[@]}" --preserve-metadata=entitlements "$nested"
            done
            "${SIGN[@]}" --preserve-metadata=entitlements "$SPARKLE"
          fi

          # 3. The app last, with its own entitlements.
          "${SIGN[@]}" --entitlements VPNPlus/VPNPlus.release.entitlements "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

          # Notarization rejects get-task-allow — fail fast if it crept in.
          for subject in "$APP" "$EXT"; do
            if codesign -d --entitlements - "$subject" 2>/dev/null | grep -q get-task-allow; then
              echo "::error::get-task-allow present on $subject" >&2
              exit 1
            fi
          done

          # The suffixed value is what a Developer ID profile allow-lists; the
          # un-suffixed one is a debug build that would fail at activation.
          for subject in "$APP" "$EXT"; do
            codesign -d --entitlements - "$subject" 2>/dev/null \
              | grep -q "packet-tunnel-provider-systemextension" \
              || { echo "::error::$subject is missing the -systemextension entitlement"; exit 1; }
          done

      - name: Package DMG
        run: |
          mkdir -p dist/dmg-root artifacts
          cp -R "build/Build/Products/Release/VPN Plus.app" dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "VPN Plus" -srcfolder dist/dmg-root \
            -ov -format UDZO "artifacts/VPNPlus-${GITHUB_REF_NAME#v}.dmg"

      - name: Notarize & staple
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="artifacts/VPNPlus-${GITHUB_REF_NAME#v}.dmg"
          # submit --wait exits 0 even when the verdict is Invalid — check the
          # status ourselves and dump the notary log on rejection.
          SUBMIT_JSON=$(xcrun notarytool submit "$DMG" --wait --output-format json \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID")
          echo "$SUBMIT_JSON"
          STATUS=$(echo "$SUBMIT_JSON" | jq -r .status)
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(echo "$SUBMIT_JSON" | jq -r .id)
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi
          xcrun stapler staple "$DMG"

      - name: Generate Sparkle appcast
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Keep in sync with the Sparkle version in project.yml.
          SPARKLE_VERSION=2.9.6
          curl -L -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle-dist && tar -xf sparkle.tar.xz -C sparkle-dist
          # generate_appcast attaches release notes from a file named after
          # the archive; --embed-release-notes inlines them in the appcast as
          # <description sparkle:format="markdown">, so the update alert needs
          # no second download. Removed again afterwards to keep the release
          # assets to the DMG and the appcast.
          NOTES="artifacts/VPNPlus-${GITHUB_REF_NAME#v}.md"
          cp release-notes.md "$NOTES"
          echo "$SPARKLE_ED_PRIVATE_KEY" | ./sparkle-dist/bin/generate_appcast \
            --ed-key-file - \
            --embed-release-notes \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            artifacts
          rm -f "$NOTES"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [ "$HAS_SIGNING" != "true" ]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "VPN Plus ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md $PRERELEASE
