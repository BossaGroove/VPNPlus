# Generated project — edit this file, never the pbxproj, then run:
#   xcodegen generate
# Both this file and the generated project are committed (CLAUDE.md).
name: VPNPlus

options:
  bundleIdPrefix: com.bossagroove
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  VPNPlusCore:
    path: Packages/VPNPlusCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: DR9YZ5L9PX
    # B2/D173: the release pipeline signs manually, outside Xcode, because
    # Xcode demands an exact entitlement/profile match and our profiles
    # allow-list eight NetworkExtension values where we claim one.
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode 16 puts a Debug app's code in a separate "<name>.debug.dylib" for
    # previews and hot reload. We sign by hand and use neither, and an unsigned
    # nested dylib is refused under the hardened runtime, so build one binary.
    ENABLE_DEBUG_DYLIB: NO
    # Not sandboxed: Developer ID distribution, and a system extension host.
    ENABLE_APP_SANDBOX: NO

targets:
  VPNPlus:
    type: application
    platform: macOS
    scheme:
      testTargets: [VPNPlusEngineTests]
    sources:
      - path: VPNPlus
        excludes: ["*.entitlements", "Info.plist"]
      - path: VPNPlusShared
    dependencies:
      - package: VPNPlusCore
        product: VPNPlusCore
      - target: VPNPlusTunnel
        embed: true
        codeSign: false
      # Import validates with the same parse a connection would use (D189), so
      # the app links the engine as well. It calls only the parsing functions.
      - target: VPNPlusEngine
      - sdk: libc++.tbd
      - sdk: SystemConfiguration.framework
      - sdk: IOKit.framework
      - sdk: CoreServices.framework
      - sdk: CoreFoundation.framework
    # XcodeGen GENERATES this file from the properties below — it does not
    # merge with whatever is on disk. Anything hand-written at this path is
    # silently overwritten, so every key the bundle needs must be here.
    info:
      path: VPNPlus/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: GPL-3.0-or-later
        # A .ovpn file has no system-declared type, so VPN Plus declares one
        # and claims it. This is what makes double-click import work (2.1).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bossagroove.VPNPlus.ovpn-profile
            UTTypeDescription: OpenVPN Profile
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [ovpn]
        CFBundleDocumentTypes:
          - CFBundleTypeName: OpenVPN Profile
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.bossagroove.VPNPlus.ovpn-profile]
    settings:
      base:
        # User-facing name, with the space. The extension keeps a symbol-safe
        # product name because its module name is referenced from Info.plist.
        PRODUCT_NAME: VPN Plus
        PRODUCT_BUNDLE_IDENTIFIER: com.bossagroove.VPNPlus
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # The extension is embedded here, which is what makes a Sparkle update
        # carry it and keeps every update free of an installer (D169).
        SYSTEM_EXTENSION_FOLDER_PATH: Contents/Library/SystemExtensions
        SWIFT_OBJC_BRIDGING_HEADER: VPNPlus/VPNPlus-Bridging-Header.h
        HEADER_SEARCH_PATHS: [$(SRCROOT)/VPNPlusEngine/include]
        LIBRARY_SEARCH_PATHS: [$(SRCROOT)/ThirdParty/out/lib]
        OTHER_LDFLAGS: [-lssl, -lcrypto, -llz4, -lfmt]
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: VPNPlus/VPNPlus.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: VPNPlus/VPNPlus.release.entitlements

  VPNPlusTunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: VPNPlusTunnel
        excludes: ["*.entitlements", "Info.plist"]
      - path: VPNPlusShared
    dependencies:
      - package: VPNPlusCore
        product: VPNPlusCore
      - sdk: NetworkExtension.framework
      - target: VPNPlusEngine
      # The engine is C++ and this target is not; the linker needs telling.
      - sdk: libc++.tbd
      # openvpn3's macOS build links these four (cmake/findcoredeps.cmake).
      - sdk: SystemConfiguration.framework
      - sdk: IOKit.framework
      - sdk: CoreServices.framework
      - sdk: CoreFoundation.framework
    # Same generation rule as the app. NEProviderClasses is what makes this
    # bundle a tunnel provider once activated; it is required, but its absence
    # was not the cause of the activation failure — PRODUCT_NAME below was.
    info:
      path: VPNPlusTunnel/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Resolves to SYSX, the value Xcode sets for this product type.
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleDisplayName: VPN Plus Tunnel
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # The user-facing text for the approval flow. Xcode's template and
        # shipping NE system extensions carry it.
        NSSystemExtensionUsageDescription: VPN Plus needs this component to carry your network traffic through the VPN.
        NSHumanReadableCopyright: GPL-3.0-or-later
        NetworkExtension:
          # Must be inside an app group the extension is entitled to — Xcode's
          # template and LuLu both do this; a bare team-prefixed name is not enough.
          NEMachServiceName: DR9YZ5L9PX.com.bossagroove.VPNPlus.tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        # sysextd matches the requested identifier against the DIRECTORY NAME in
        # Contents/Library/SystemExtensions — it never opens the bundle to read
        # its plist (fs_usage, C4). So the bundle must be named after its
        # identifier, as Xcode does by default and as Karabiner and LuLu ship.
        PRODUCT_NAME: com.bossagroove.VPNPlus.tunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.bossagroove.VPNPlus.tunnel
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Swift sees the engine through one C header (D179).
        SWIFT_OBJC_BRIDGING_HEADER: VPNPlusTunnel/VPNPlusTunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: [$(SRCROOT)/VPNPlusEngine/include]
        # A static library carries no link dependencies of its own, so the
        # engine's libraries and frameworks are linked here (see VPNPlusEngine).
        LIBRARY_SEARCH_PATHS: [$(SRCROOT)/ThirdParty/out/lib]
        OTHER_LDFLAGS: [-lssl, -lcrypto, -llz4, -lfmt]
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: VPNPlusTunnel/VPNPlusTunnel.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: VPNPlusTunnel/VPNPlusTunnel.release.entitlements

  # The engine: openvpn3 compiled into one static library behind a C header.
  # No Swift here, no openvpn3 outside it (D179). Its C dependencies come from
  # Scripts/build-deps.sh, which must have run before this builds; consumers
  # link those libraries themselves.
  VPNPlusEngine:
    type: library.static
    platform: macOS
    sources:
      - path: VPNPlusEngine
    settings:
      base:
        PRODUCT_NAME: VPNPlusEngine
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: [$(SRCROOT)/VPNPlusEngine/include]
        # System header paths, so third-party code is held to its own warning
        # standard and ours stays warning-clean. ovpncli.cpp is included
        # through this path too, so it counts as system code as well.
        SYSTEM_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/ThirdParty/openvpn3
          - $(SRCROOT)/ThirdParty/out/include
        # The define set openvpn3's own client is built with on macOS
        # (add_corelibrary_dependencies), plus the tun-builder interface,
        # which is how the engine hands us settings instead of editing routes
        # itself, and external PKI for pkcs12 profiles.
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - ASIO_STANDALONE
          - USE_ASIO
          - HAVE_LZ4
          - USE_OPENSSL
          - USE_TUN_BUILDER
          - ENABLE_EXTERNAL_PKI

  VPNPlusEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VPNPlusEngineTests
    dependencies:
      - target: VPNPlusEngine
      - sdk: libc++.tbd
      - sdk: SystemConfiguration.framework
      - sdk: IOKit.framework
      - sdk: CoreServices.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bossagroove.VPNPlus.EngineTests
        SWIFT_OBJC_BRIDGING_HEADER: VPNPlusEngineTests/VPNPlusEngineTests-Bridging-Header.h
        HEADER_SEARCH_PATHS: [$(SRCROOT)/VPNPlusEngine/include]
        LIBRARY_SEARCH_PATHS: [$(SRCROOT)/ThirdParty/out/lib]
        OTHER_LDFLAGS: [-lssl, -lcrypto, -llz4, -lfmt]
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
