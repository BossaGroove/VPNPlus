# Generated project — edit this file, never the pbxproj, then run:
#   xcodegen generate
# Both this file and the generated project are committed (CLAUDE.md).
name: VPNPlus

options:
  bundleIdPrefix: com.bossagroove
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  VPNPlusCore:
    path: Packages/VPNPlusCore
  # MIT. Keep the version in step with release.yml's generate_appcast.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: DR9YZ5L9PX
    # B2/D173: the release pipeline signs manually, outside Xcode, because
    # Xcode demands an exact entitlement/profile match and our profiles
    # allow-list eight NetworkExtension values where we claim one.
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode 16 puts a Debug app's code in a separate "<name>.debug.dylib" for
    # previews and hot reload. We sign by hand and use neither, and an unsigned
    # nested dylib is refused under the hardened runtime, so build one binary.
    ENABLE_DEBUG_DYLIB: NO
    # Not sandboxed: Developer ID distribution, and a system extension host.
    ENABLE_APP_SANDBOX: NO

targets:
  VPNPlus:
    type: application
    platform: macOS
    scheme:
      testTargets: [VPNPlusEngineTests, VPNPlusSharedTests, VPNPlusCopyTests]
    sources:
      - path: VPNPlus
        excludes: ["*.entitlements", "Info.plist", "AppIcon.icon"]
      - path: VPNPlusShared
      # The words: failure messages, phase labels, the record's phrases. Their
      # own folder so a test bundle can render every one of them (M6.4).
      - path: VPNPlusCopy
      # What's New reads the same changelog the release notes come from.
      - path: CHANGELOG.md
        buildPhase: resources
      # The About panel reads Credits.html by name; it carries the third-party
      # notices (M9.2), generated with THIRD_PARTY_NOTICES.md by
      # Scripts/make-notices.py.
      - path: VPNPlus/Credits.html
        buildPhase: resources
    dependencies:
      - package: VPNPlusCore
        product: VPNPlusCore
      - package: Sparkle
      - target: VPNPlusTunnel
        embed: true
        codeSign: false
      # Import validates with the same parse a connection would use (D189), so
      # the app links the engine as well. It calls only the parsing functions.
      - target: VPNPlusEngine
      - sdk: libc++.tbd
      - sdk: SystemConfiguration.framework
      - sdk: IOKit.framework
      - sdk: CoreServices.framework
      - sdk: CoreFoundation.framework
      - sdk: UserNotifications.framework
      - sdk: ServiceManagement.framework
    postCompileScripts:
      - name: Compile Icon Composer icon
        script: |
          xcrun actool "$SRCROOT/VPNPlus/AppIcon.icon" \
            --compile "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --app-icon AppIcon --platform macosx \
            --minimum-deployment-target "$MACOSX_DEPLOYMENT_TARGET" \
            --output-partial-info-plist "$DERIVED_FILE_DIR/AppIcon-partial.plist"
        inputFiles:
          - $(SRCROOT)/VPNPlus/AppIcon.icon/icon.json
          - $(SRCROOT)/VPNPlus/AppIcon.icon/Assets/plus.svg
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Assets.car
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon.icns
    preBuildScripts:
      - name: Release builds carry the Sparkle key
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ -z "$SPARKLE_ED_PUBLIC_KEY" ]; then
            echo "error: SPARKLE_ED_PUBLIC_KEY is empty — a Release build cannot verify updates. M9 supplies the key."
            exit 1
          fi
    # XcodeGen GENERATES this file from the properties below — it does not
    # merge with whatever is on disk. Anything hand-written at this path is
    # silently overwritten, so every key the bundle needs must be here.
    info:
      path: VPNPlus/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Icon Composer icon (VPNPlus/AppIcon.icon, compiled by the actool
        # script phase): layered on macOS 26+, actool's generated fallbacks
        # (Assets.car + icns) for macOS 14 and 15. The same arrangement as
        # the sibling app, whose icon the Finder renders correctly.
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        # Sparkle. The appcast is a release asset, so "latest" always points
        # at the newest release's copy. The public key is a build setting that
        # M9 fills in; a Release build with it empty fails (see the script).
        SUFeedURL: https://github.com/BossaGroove/VPNPlus/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_ED_PUBLIC_KEY)
        SUEnableInstallerLauncherService: false
        # A15's default: on. Set here, Sparkle never shows its own "check
        # automatically?" prompt on the second launch (D143: one answer).
        SUEnableAutomaticChecks: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: GPL-3.0-or-later
        # A .ovpn file has no system-declared type, so VPN Plus declares one
        # and claims it. This is what makes double-click import work (2.1).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bossagroove.VPNPlus.ovpn-profile
            UTTypeDescription: OpenVPN Profile
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [ovpn]
        CFBundleDocumentTypes:
          - CFBundleTypeName: OpenVPN Profile
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.bossagroove.VPNPlus.ovpn-profile]
    settings:
      base:
        # User-facing name, with the space. The extension keeps a symbol-safe
        # product name because its module name is referenced from Info.plist.
        PRODUCT_NAME: VPN Plus
        PRODUCT_BUNDLE_IDENTIFIER: com.bossagroove.VPNPlus
        # The icon, generated by Scripts/make-appicon.swift (M9.1) — the
        # geometry is the source; the PNGs are its output, committed because
        # the build needs them.
        MARKETING_VERSION: "1.0.0"
        # Sparkle's EdDSA public key. Empty until M9; Release refuses to build
        # without it, so an unverifiable update can never ship by accident.
        SPARKLE_ED_PUBLIC_KEY: ""
        CURRENT_PROJECT_VERSION: "1"
        # The extension is embedded here, which is what makes a Sparkle update
        # carry it and keeps every update free of an installer (D169).
        SYSTEM_EXTENSION_FOLDER_PATH: Contents/Library/SystemExtensions
        SWIFT_OBJC_BRIDGING_HEADER: VPNPlus/VPNPlus-Bridging-Header.h
        HEADER_SEARCH_PATHS: [$(SRCROOT)/VPNPlusEngine/include]
        LIBRARY_SEARCH_PATHS: [$(SRCROOT)/ThirdParty/out/lib]
        OTHER_LDFLAGS: [-lssl, -lcrypto, -llz4, -lfmt]
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: VPNPlus/VPNPlus.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: VPNPlus/VPNPlus.release.entitlements

  VPNPlusTunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: VPNPlusTunnel
        excludes: ["*.entitlements", "Info.plist"]
      - path: VPNPlusShared
    dependencies:
      - package: VPNPlusCore
        product: VPNPlusCore
      - sdk: NetworkExtension.framework
      - target: VPNPlusEngine
      # The engine is C++ and this target is not; the linker needs telling.
      - sdk: libc++.tbd
      # openvpn3's macOS build links these four (cmake/findcoredeps.cmake).
      - sdk: SystemConfiguration.framework
      - sdk: IOKit.framework
      - sdk: CoreServices.framework
      - sdk: CoreFoundation.framework
    # Same generation rule as the app. NEProviderClasses is what makes this
    # bundle a tunnel provider once activated; it is required, but its absence
    # was not the cause of the activation failure — PRODUCT_NAME below was.
    info:
      path: VPNPlusTunnel/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Resolves to SYSX, the value Xcode sets for this product type.
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleDisplayName: VPN Plus Tunnel
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # The user-facing text for the approval flow. Xcode's template and
        # shipping NE system extensions carry it.
        NSSystemExtensionUsageDescription: VPN Plus needs this component to carry your network traffic through the VPN.
        NSHumanReadableCopyright: GPL-3.0-or-later
        NetworkExtension:
          # Must be inside an app group the extension is entitled to — Xcode's
          # template and LuLu both do this; a bare team-prefixed name is not enough.
          NEMachServiceName: DR9YZ5L9PX.com.bossagroove.VPNPlus.tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        # sysextd matches the requested identifier against the DIRECTORY NAME in
        # Contents/Library/SystemExtensions — it never opens the bundle to read
        # its plist (fs_usage, C4). So the bundle must be named after its
        # identifier, as Xcode does by default and as Karabiner and LuLu ship.
        PRODUCT_NAME: com.bossagroove.VPNPlus.tunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.bossagroove.VPNPlus.tunnel
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Swift sees the engine through one C header (D179).
        SWIFT_OBJC_BRIDGING_HEADER: VPNPlusTunnel/VPNPlusTunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: [$(SRCROOT)/VPNPlusEngine/include]
        # A static library carries no link dependencies of its own, so the
        # engine's libraries and frameworks are linked here (see VPNPlusEngine).
        LIBRARY_SEARCH_PATHS: [$(SRCROOT)/ThirdParty/out/lib]
        OTHER_LDFLAGS: [-lssl, -lcrypto, -llz4, -lfmt]
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: VPNPlusTunnel/VPNPlusTunnel.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: VPNPlusTunnel/VPNPlusTunnel.release.entitlements

  # The engine: openvpn3 compiled into one static library behind a C header.
  # No Swift here, no openvpn3 outside it (D179). Its C dependencies come from
  # Scripts/build-deps.sh, which must have run before this builds; consumers
  # link those libraries themselves.
  VPNPlusEngine:
    type: library.static
    platform: macOS
    sources:
      - path: VPNPlusEngine
    settings:
      base:
        PRODUCT_NAME: VPNPlusEngine
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: [$(SRCROOT)/VPNPlusEngine/include]
        # System header paths, so third-party code is held to its own warning
        # standard and ours stays warning-clean. ovpncli.cpp is included
        # through this path too, so it counts as system code as well.
        SYSTEM_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/ThirdParty/openvpn3
          - $(SRCROOT)/ThirdParty/out/include
        # The define set openvpn3's own client is built with on macOS
        # (add_corelibrary_dependencies), plus the tun-builder interface,
        # which is how the engine hands us settings instead of editing routes
        # itself, and external PKI for pkcs12 profiles.
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - ASIO_STANDALONE
          - USE_ASIO
          - HAVE_LZ4
          - USE_OPENSSL
          - USE_TUN_BUILDER
          - ENABLE_EXTERNAL_PKI

  # The app↔extension boundary's own code: the redactor that stands between
  # the engine and everything kept (D199), and the table where OpenVPN's event
  # names meet A10's failure codes. Both were untestable until M6.2, because
  # nothing compiled VPNPlusShared except the two shipping targets.
  VPNPlusSharedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VPNPlusSharedTests
      - path: VPNPlusShared
    dependencies:
      - package: VPNPlusCore
        product: VPNPlusCore
      # The network fingerprint asks SystemConfiguration for an interface's
      # kind, because the BSD link type calls Wi-Fi Ethernet (D200).
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bossagroove.VPNPlus.SharedTests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  # Every message the user can read, rendered with every payload, and checked
  # for what must never be in one: a code, an engine identifier, the word
  # "Error" (feature-spec 4.1, D105). Foundation and the core only — no AppKit
  # — which is what lets a logic bundle render them.
  VPNPlusCopyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VPNPlusCopyTests
      - path: VPNPlusCopy
      - path: VPNPlusShared
    dependencies:
      - package: VPNPlusCore
        product: VPNPlusCore
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bossagroove.VPNPlus.CopyTests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  # The UI suite (M8.4): a unit-test bundle *hosted by the app*, which the
  # scheme launches in rehearsal. The tests run inside the app's process and
  # drive its own window; nothing crosses to the owner's input or focus.
  VPNPlusAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VPNPlusAppTests
    dependencies:
      - target: VPNPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bossagroove.VPNPlus.AppTests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # The host by its product name, which has a space; the generated
        # default used the target name and found nothing.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VPN Plus.app/Contents/MacOS/VPN Plus"
        BUNDLE_LOADER: $(TEST_HOST)

  VPNPlusEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VPNPlusEngineTests
    dependencies:
      - target: VPNPlusEngine
      - sdk: libc++.tbd
      - sdk: SystemConfiguration.framework
      - sdk: IOKit.framework
      - sdk: CoreServices.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bossagroove.VPNPlus.EngineTests
        SWIFT_OBJC_BRIDGING_HEADER: VPNPlusEngineTests/VPNPlusEngineTests-Bridging-Header.h
        HEADER_SEARCH_PATHS: [$(SRCROOT)/VPNPlusEngine/include]
        LIBRARY_SEARCH_PATHS: [$(SRCROOT)/ThirdParty/out/lib]
        OTHER_LDFLAGS: [-lssl, -lcrypto, -llz4, -lfmt]
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

# The UI suite's scheme: the host launched in rehearsal. `VPNPLUS_SHOTS` is a
# build setting given on the xcodebuild command line, handed to the host as an
# environment variable, so the sweep's PNGs land where the caller says.
# `Scripts/ui-test.sh` is the invocation; the ordinary `xcodebuild test` on the
# VPNPlus scheme is unchanged.
schemes:
  VPNPlusAppTests:
    build:
      targets:
        VPNPlus: all
        VPNPlusAppTests: [test]
    test:
      config: Debug
      targets: [VPNPlusAppTests]
      commandLineArguments:
        "-UITesting": true
      environmentVariables:
        - variable: VPNPLUS_SHOTS
          value: $(VPNPLUS_SHOTS)
          isEnabled: true
